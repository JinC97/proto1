            const t=interp(ch, g.rangeM), u=clamp((g.rangeM-t.min)/Math.max(1e-9, t.max-t.min), 0, 1), x=2*u-1, site=Math.atan2(g.dh,
            g.rangeM)*6400/(2*Math.PI), activity=Math.tanh(Math.abs(site)/Math.max(1e-9, +P.SITE_ANGLE_REF_MIL)), gain=clamp(+P.SITE_GAIN_BASE+(+P.SITE_GAIN_RANGE)*x+(+P.SITE_GAIN_ANGLE)*activity,
            +P.SITE_GAIN_MIN, +P.SITE_GAIN_MAX), raw=-(gain*site+(+P.SITE_QUADRATIC_GAIN)*site*Math.abs(site)/Math.max(1e-9, +P.SITE_ANGLE_REF_MIL)),
            lim=Math.max(1e-9, +P.SITE_CORRECTION_LIMIT_MIL), corr=lim*Math.tanh(raw/lim), qe=clamp(t.qe+corr, +P.MIN_ELEVATION_MIL, +P.MAX_ELEVATION_MIL),
            dq=qe-t.qe, ratio=clamp(1+(+P.TOF_ELEVATION_GAIN)*Math.tanh(dq/Math.max(1e-9, +P.TOF_ELEVATION_SCALE_MIL)), +P.TOF_RATIO_MIN,
            +P.TOF_RATIO_MAX), tof=Math.max(.1, t.tof*ratio);
            state.charge=ch;
            state.solution={
                rangeM:g.rangeM, lineMil:g.lineMil, elevationMil:qe, tof, siteMil:site, siteCorrection:corr, baseQE:t.qe, baseTOF:t.tof, lower:t.lo,
                upper:t.hi, safe:true
            };
            state.solutionValid=true;
            state.recomputePending=false;
            state.buAccepted=false;
            addStatus(`BU computed with fictional C${ch} table`);
            save();
            show('bu_compute')
        } catch(e){
            popup('BU COMPUTE', e.message, [['OK', ()=>{
            }]])
        }
    }

    function popup(title, msg, buttons){
        document.querySelectorAll('.popup').forEach(e=>e.remove());
        dialogActions={};
        const q=mk('div', 'popup', {
            left:'355px', top:'260px', width:'315px', minHeight:'150px'
        });
        q.innerHTML=`<div style="font-weight:bold;font-size:16px">${esc(title)}</div><div style="margin-top:18px;font-size:13px">${esc(msg)}</div>`;
        const box=mk('div', '', null, q);
        buttons.forEach(([l, fn], index)=>{
            const b=mk('button', '', null, box);
            b.textContent=l;
            const invoke=()=>{
                q.remove();
                dialogActions=null;
                fn();
            };
            b.onclick=invoke;
            dialogActions[buttons.length===2?(index===0?1:7):7]=invoke;
        });
    }
    function modal(title, fields, onOK, w=470, h=360){
        dialogActions={};
        mk('div', 'modalshade');
        const m=mk('div', 'modal', {
            left:((1024-w)/2)+'px', top:Math.max(70, (620-h)/2)+'px', width:w+'px', height:h+'px'
        });
        const h3=document.createElement('h3');
        h3.textContent=title;
        m.appendChild(h3);
        const form=document.createElement('form');
        m.appendChild(form);
        fields.forEach(f=>{
            const lab=document.createElement('label');
            const sp=document.createElement('span');
            sp.textContent=f.label;
            lab.appendChild(sp);
            let inp;
            if(f.type==='select'){
                inp=document.createElement('select');
                (f.options||[]).forEach(o=>{
                    const op=document.createElement('option');
                    op.value=o;
                    op.textContent=o;
                    if(String(o)===String(f.value))op.selected=true;
                    inp.appendChild(op)
                })
            } else{
                inp=document.createElement('input');
                inp.type=f.type||'text';
                inp.value=f.value??''
            }
            inp.name=f.name;
            lab.appendChild(inp);
            form.appendChild(lab)
        });
        const act=mk('div', 'modal-actions', null, form);
        const cancel=mk('button', '', null, act);
        cancel.type='button';
        cancel.textContent='F8 CANCEL';
        const ok=mk('button', '', null, act);
        ok.textContent='F7 ACCEPT';
        const cancelModal=()=>{
            document.querySelector('.modalshade')?.remove();
            m.remove();
            dialogActions=null;
        };
        cancel.onclick=cancelModal;
        dialogActions[8]=cancelModal;
        form.onsubmit=e=>{
            e.preventDefault();
            const vals=Object.fromEntries(new FormData(form));
            document.querySelector('.modalshade')?.remove();
            m.remove();
            dialogActions=null;
            onOK(vals);
            save();
            render();
        };
        dialogActions[7]=()=>form.requestSubmit();
        m.querySelector('input,select')?.focus();
    }

    function computeAdjustment(){
        const a=state.pendingAdjust;
        if(!a)return;
        const th=a.direction*2*Math.PI/6400;
        const de=a.lateral*Math.cos(th)+a.longitudinal*Math.sin(th), dn=-a.lateral*Math.sin(th)+a.longitudinal*Math.cos(th);
        state.pendingAdjustResult={
            grid_x:state.currentMission.target.grid_x+de/1000, grid_y:state.currentMission.target.grid_y+dn/1000
        };
        save();
        render()
    }

    }
    function editScenarioTx(r){
        if(!r)return;
        modal('TRANSMISSION DETAILS', [{
            label:'Mission Type', name:'t', value:r.mission_type||'--'
        }, {
            label:'Method of Fire', name:'f', value:r.method_of_fire||'--'
        }, {
            label:'Method of Control', name:'c', value:r.method_of_control||'--'
        }, {
            label:'Time on Target', name:'tot', value:r.time_on_target||'--'
        }, {
            label:'Post BTID °C', name:'bt', value:r.post_btid_temp_c??25
        }], v=>Object.assign(r, {
            mission_type:v.t, method_of_fire:v.f, method_of_control:v.c, time_on_target:v.tot, post_btid_temp_c:+v.bt
        }), 440, 320)
    }
    function editScenarioAdj(r){
        if(!r)return;
        modal('FOLLOW-UP ADJUSTMENT', [{
            label:'Enabled', name:'e', type:'select', value:r.follow_adjust_enabled?'Yes':'No', options:['Yes', 'No']
        }], v=>r.follow_adjust_enabled=v.e==='Yes', 380, 170)
    }
    function deleteScenario(r){
        if(r&&confirm('Delete selected scenario mission?')){
            state.scenario=state.scenario.filter(x=>x.id!==r.id);
            state.scenarioIndex=clamp(state.scenarioIndex, 0, Math.max(0, state.scenario.length-1));
            save();
            render()
        }
    }
    // -----------------------------------------------------------------------------
    // Simulated BMS scenario lifecycle (workflow only; no real communications)
    // Desktop source: manual_app.py, lines 2840-3050, v1.7.10.
    // -----------------------------------------------------------------------------
    let deliveryTimer=null;
    function cancelDeliveryTimer(){
        if(deliveryTimer!==null)clearTimeout(deliveryTimer);
        deliveryTimer=null;
    }
    function queueSelected(r){
        if(!state.trainerMode||!r)return;
        state.scenarioQueue.push(r.id);
        event('MISSION QUEUED '+r.mission_ref);
        save();
        render();
    }
    function queueAll(){
        if(!state.trainerMode)return;
        seedScenario();
        const enabled=state.scenario.filter(r=>r.enabled===undefined||!!r.enabled);
        if(!state.scenarioQueue.length&&!state.activeScenarioId&&!state.pendingBmsId)state.scenarioDeliveryCount=0;
        state.scenarioQueue.push(...enabled.map(r=>r.id));
        event('SCENARIO QUEUED '+enabled.length+' enabled mission(s)');
        save();
        render();
    }
    function dispatchNextQueued(){
        if(state.trainerMode||deliveryTimer!==null||state.pendingBmsId!==null||state.activeScenarioId!==null||!state.scenarioQueue.length)return;
        const id=state.scenarioQueue[0], r=state.scenario.find(x=>x.id===id);
        if(!r){
            state.scenarioQueue.shift();
            save();
            return dispatchNextQueued();
        }
        // Desktop v1.7.10: initial 10–50 sec; later arrivals 20–60 sec.
        const isFirst=state.scenarioDeliveryCount===0;
        const lo=isFirst?10:20, hi=isFirst?50:60;
        const delaySec=lo+Math.floor(Math.random()*(hi-lo+1));
        event('DELIVERY ARMED '+r.mission_ref+' (simulated '+delaySec+'s)');
        save();
        deliveryTimer=setTimeout(()=>{
            deliveryTimer=null;
            deliverQueuedScenario(id);
        },delaySec*1000);
    }
    function deliverQueuedScenario(id){
        if(state.trainerMode||state.pendingBmsId!==null||state.activeScenarioId!==null||state.scenarioQueue[0]!==id)return;
        const r=state.scenario.find(x=>x.id===id);
        if(!r){
            state.scenarioQueue.shift();
            save();
            return dispatchNextQueued();
        }
        if(state.settings.bms_connected!=='Connected'){
            event('DELIVERY FAILED '+r.mission_ref+' (BMS link unavailable; retained for retry)');
            save();
            return;
        }
        state.scenarioQueue.shift();
        state.scenarioDeliveryCount++;
        state.pendingBmsId=id;
        event('BMS SIM FIRE MISSION '+r.mission_ref);
        save();
        showInboundScenario(r);
    }
    function showInboundScenario(r){
        // No real BMS packets are sent. The title/text and two actions follow
        // the source's Figure 5.2.2-2-facing simulator workflow.
        popup('Incoming BMS Message', 'Firemission Received', [
            ['Reject', ()=>{
                state.pendingBmsId=null;
                event('MISSION REJECTED '+r.mission_ref);
                save();
                render();
                setTimeout(dispatchNextQueued,75);
            }],
            ['Accept', ()=>acceptScenario(r)]
        ]);
    }
    function acceptScenario(r){
        if(state.pendingBmsId!==r.id)return;
        state.currentMission={
            id:r.id, mission_no:r.mission_ref, external_mission_id:r.mission_ref,
            mission_type:r.mission_type||'--',method_of_fire:r.method_of_fire||'--',
            method_of_control:r.method_of_control||'--',bomb_interval:r.bomb_interval||'--',
            time_on_target:r.time_on_target||'--',met_usage:r.met_usage||'Standard',
            reg_usage:r.reg_usage||'Not In Use',profile_code:r.ammo_code||'HE',
            quantity:r.quantity||1,objective_name:r.mission_ref,target:{
                grid_x:r.target_x,grid_y:r.target_y,height:r.target_height,zone:r.target_zone||'SIM-A'
            }
        };
        state.pendingBmsId=null;
        state.activeScenarioId=r.id;
        state.solution=null;
        state.solutionValid=false;
        state.recomputePending=false;
        state.buAccepted=false;
        state.chargeManual=false;
        state.charge=null;
        state.roundsFired=0;
        state.eomQty=0;
        event('MISSION ACCEPT (simulated acknowledgement) '+r.mission_ref);
        save();
        show('fire_order');
    }
    function scheduleAdjustment(){
        const r=state.scenario.find(x=>x.id===state.currentMission.id);
        if(r?.follow_adjust_enabled){
            event('Follow adjustment scheduled '+r.mission_ref);
            save()
        }
    }
    function ackMessages(){
        state.messages=[];
        state.messageBacklog=[];
        state.messagePage=0;
        addStatus('FCU messages acknowledged/cleared');
        save();
        render()
    }
    function resetTraining(){
        if(!confirm('E-Erase / reset local training data?'))return;
        const keepLogged=state.loggedIn, keepTrainer=state.trainerMode;
        state=defaults();
        state.loggedIn=keepLogged;
        state.trainerMode=keepTrainer;
        state.screen='main_menu';
        save();
        render()
    }
    function toggleTrainer(){
        state.trainerMode=!state.trainerMode;
        if(state.trainerMode){
            cancelDeliveryTimer();
            seedScenario();
            state.screen='scenario_builder'
        } else{
            if(['scenario_builder', 'settings', 'reference'].includes(state.screen))state.screen='main_menu';
            setTimeout(()=>dispatchNextQueued(), 25)
        }
        render()
    }
    function toggleTravelLock(){
        state.settings.travel_lock=state.settings.travel_lock==='T-Lock Out'?'T-Lock In':'T-Lock Out';
        addStatus('Travel lock '+state.settings.travel_lock);
        save();
        render()
    }
    function toggleNavigation(){
        state.settings.navigation_system=state.settings.navigation_system==='Online'?'Offline':'Online';
        addStatus('Navigation system '+state.settings.navigation_system);
        save();
        render()
    }
    function editLoginSettings(){
        modal('LOGIN SETTINGS', [{
            label:'User name', name:'u', value:state.login?.username||'DAT'
        }, {
            label:'Password', name:'p', type:'password', value:state.login?.password||'FCU'
        }], v=>{
            state.login={
                username:v.u||'DAT', password:v.p||'FCU'
            };
            addStatus('FCU local login settings updated')
        }, 390, 190)
    }
    function backupState(){
        const blob=new Blob([JSON.stringify(state, null, 2)], {
            type:'application/json'
        }), u=URL.createObjectURL(blob), a=document.createElement('a');
        a.href=u;
        a.download='fcu_html_backup_'+new Date().toISOString().replaceAll(':', '-')+'.json';
        a.click();
        setTimeout(()=>URL.revokeObjectURL(u), 1000);
        addStatus('Simulator state backup exported')
    }
    function editSafetyTransmission(){
        modal('SAFETY LIMIT TRANSMISSION', [{
            label:'Enabled', name:'e', type:'select', value:state.settings.scenario_safety_limit_enabled||'Disabled', options:['Enabled',
            'Disabled']
        }, {
            label:'Left Limit', name:'l', value:state.settings.scenario_safety_left_mil||'640.0'
        }, {
            label:'Right Limit', name:'r', value:state.settings.scenario_safety_right_mil||'5760.0'
        }], v=>{
            state.settings.scenario_safety_limit_enabled=v.e;
            state.settings.scenario_safety_left_mil=v.l;
            state.settings.scenario_safety_right_mil=v.r;
            event('Safety transmission '+v.e)
        }, 420, 230)
    }
    function statusMonitor(){
        popup('STATUS MONITOR', `Screen: ${state.screen}\nNavigation: ${state.settings.navigation_system}\nBMS: ${state.settings.bms_connected}\nRMCU: ${state.settings.rmcu_mode}\nRecent status: ${(state.status.at(-1)||'--')}`,
        [['OK', ()=>{
        }]])
    }
    function about(){
        popup('ABOUT', 'FCU Simulator HTML reconstruction\nBaseline: v1.7.10\nTraining-only portable browser implementation.', [['OK',
        ()=>{
        }]])
    }
    // -----------------------------------------------------------------------------
    // Screen router / keyboard entry point
    // -----------------------------------------------------------------------------
    function show(s){
        state.screen=s;
        save();
        render()
    }
    function render(){
        if(!state.loggedIn)return login();
        hostMenus();
        clear();
        const map={
            main_menu:mainMenu, fire_order:fireOrder, bu_compute:buCompute, fire_execute:fireExecute, navigation, preparation, safety_limits:safetyLimits,
            inventory, target_list:targetList, position_list:positionList, update_inu:updateInu, override, maintenance, fcu_status:fcuStatus,
            btid_status:btidStatus, inu_status:inuStatus, bms_status:bmsStatus, rmcu_status:rmcuStatus, als_cycling:alsCycling, mls_control:mlsControl,
            report, message_log:messageLog, eom, fire_adjust:fireAdjust, change_zone:changeZone, settings:settingsScreen, troubleshooting,
            scenario_builder:scenarioBuilder, reference
        };
        (map[state.screen]||mainMenu)()
    }
    addEventListener('keydown', e=>{
        const m=/^F(\d{1,2})$/.exec(e.key);
        if(m){
            const fn=dialogActions?dialogActions[+m[1]]:actions[+m[1]];
            if(fn){
                e.preventDefault();
                fn()
            }
        }
        if(e.key==='Escape'&&dialogActions){
            e.preventDefault();
            const cancel=dialogActions[8]||dialogActions[1];
            if(cancel)cancel();
        }
    });
    setInterval(()=>{
        const e=document.getElementById('footerClock');
        if(e)e.textContent=new Date().toLocaleTimeString('en-GB', {
            hour12:false
        })
    }, 1000);
    seedScenario();
    render();
})();

    </script>
